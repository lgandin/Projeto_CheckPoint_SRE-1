name: Deploy com rollback automático

on:
  workflow_run:
    workflows: ["Testes Automatizados"]
    branches: [ main ]
    types:
      - completed

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Executar deploy
        id: deploy
        #Ponto que precisa de atenção é a troca da versão, é uma dependencia do script sh, ja mapeie este problema e estou ajustando, enquanto isso sera preciso mudar diretamente no yml. ( Leonardo Gandin - 23/02/26 )
        run: ./Deploy/deploy.sh 1.0.1

      - name: Deploy OK
        if: success()
        run: echo "Deploy concluido com sucesso, nenhum rollback sera executado."

  rollback:
    needs: deploy
    if: needs.deploy.result == 'failure'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Executar rollback
        run: ./Rollback/rollback.sh
