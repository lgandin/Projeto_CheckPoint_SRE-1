name: Deploy com rollback automático

on:
  workflow_run:
    workflows: ["Testes Automatizados"]  # name: exato do test.yml
    branches: [ main ]
    types:
      - completed

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Executar deploy
        id: deploy
        run: ./Deploy/deploy.sh

      - name: Deploy OK
        if: success()
        run: echo "Deploy concluido com sucesso, nenhum rollback sera executado."

  rollback:
    needs: deploy
    if: needs.deploy.result == 'failure'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Executar rollback
        run: ./Rollback/rollback.sh
